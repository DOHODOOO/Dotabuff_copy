<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Топ-5 Героев Dotabuff</title>
    <style>
        body { font-family: sans-serif; background: #1c242d; color: #fff; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        .item-box { background: #242f39; padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #4caf50; }
        .hero-name { font-weight: bold; color: #e5e5e5; font-size: 1.1em; }
        .winrate-val { color: #4caf50; font-size: 1.1em; font-weight: bold; }
        h1 { font-size: 20px; color: #a3b0be; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Топ-5 героев по винрейту на Crusader (7 дней)</h1>
        <p>Источник: <a href="{{ url }}" style="color: #64b5f6;" target="_blank">Dotabuff</a></p>
        
        {% if items %}
            {% for item in items %}
                <div class="item-box">
                    <div>
                        <span style="color: #888; margin-right: 10px;">#{{ loop.index }}</span>
                        <span class="hero-name">{{ item.hero }}</span>
                    </div>
                    <span class="winrate-val">{{ item.winrate }}</span>
                </div>
            {% endfor %}
        {% else %}
            <p>Не удалось извлечь элементы. Проверьте структуру страницы или логи парсера.</p>
        {% endif %}
    </div>
</body>
</html>
